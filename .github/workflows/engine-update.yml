name: Verify against engine main

# The engine repository fires this after every push to its main branch.
# Engine/ is a symlink rather than a pinned submodule, so nothing updates
# here: the job proves the game still builds against the engine as it is now.
on:
  repository_dispatch:
    types: [engine-updated]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build against engine ${{ github.event.client_payload.sha || 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the game
        uses: actions/checkout@v4
        with:
          path: SleakCraft

      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          repository: CanReader/SleakEngine
          ref: ${{ github.event.client_payload.sha || 'main' }}
          submodules: recursive
          path: SleakEngine

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxss-dev libxmu-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            glslc || sudo apt-get install -y glslang-tools

      - name: Cache compiler output
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-craft-engineupdate-${{ github.run_id }}
          restore-keys: ccache-craft-engineupdate-

      - name: Build
        working-directory: SleakCraft
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DSDL_IBUS=OFF
          cmake --build build

      - name: Open an issue if the engine broke the game
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const sha = context.payload.client_payload?.sha || 'main';
            const title = `Game fails to build against engine ${sha.substring(0,7)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'bug'
            });
            if (existing.data.some(i => i.title.startsWith('Game fails to build against engine'))) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ['bug', 'priority: critical'],
              body: `An engine change broke the game build.\n\n` +
                    `Engine commit: https://github.com/CanReader/SleakEngine/commit/${sha}\n` +
                    `Failing run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
