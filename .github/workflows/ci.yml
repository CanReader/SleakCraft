name: CI

on:
  push:
    branches: [main, staging, Advanced-Shaders]
  pull_request:
    branches: [main, staging, Advanced-Shaders]
  workflow_dispatch:
    inputs:
      engine_ref:
        description: Engine branch or SHA to build against
        default: main
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Game staging builds against engine staging, main against main and
# Advanced-Shaders against Advanced-Techniques, so a change that spans both
# repos is tested together before either reaches main. A pull request builds
# against the engine branch with the same name when one exists. A manual run
# can pick any engine branch or SHA.
env:
  ENGINE_REF: ${{ github.event.inputs.engine_ref || ((github.base_ref || github.ref_name) == 'staging' && 'staging') || ((github.base_ref || github.ref_name) == 'Advanced-Shaders' && 'Advanced-Techniques') || 'main' }}

# The check names here (the build matrix names and the other jobs' names) are
# required status checks in .github/rulesets/. Rename both together, or pull
# requests will wait on a check that never reports.
jobs:
  engine-ref:
    name: Pick the engine ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - name: Prefer the engine branch with the same name
        id: pick
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          ref="$ENGINE_REF"
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads \
              https://github.com/CanReader/SleakEngine.git "$BRANCH" > /dev/null; then
            ref="$BRANCH"
          fi
          echo "Building against engine $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: engine-ref
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Debug
            os: ubuntu-latest
            config: Debug
          - name: Linux Release
            os: ubuntu-latest
            config: Release
          - name: Windows Debug
            os: windows-latest
            config: Debug
          - name: Windows Release
            os: windows-latest
            config: Release
    steps:
      # Engine/ is a submodule. The game checkout leaves it empty, and the
      # engine checkout below fills it with the ref this run should build
      # against instead of the pinned commit.
      - name: Check out the game
        uses: actions/checkout@v7
        with:
          path: SleakCraft

      - name: Check out the engine
        uses: actions/checkout@v7
        with:
          repository: CanReader/SleakEngine
          ref: ${{ needs.engine-ref.outputs.ref }}
          submodules: recursive
          path: SleakCraft/Engine

      - name: Verify the Engine checkout resolves
        shell: bash
        run: |
          cd SleakCraft
          if [ ! -f Engine/CMakeLists.txt ]; then
            echo "Engine/ did not resolve to the engine checkout."
            ls -la Engine || true
            exit 1
          fi
          echo "Engine resolves to $(cd Engine && pwd)"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxss-dev libxmu-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            glslc || sudo apt-get install -y glslang-tools

      - name: Cache compiler output
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-craft-${{ runner.os }}-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ccache-craft-${{ runner.os }}-${{ matrix.name }}-
            ccache-craft-${{ runner.os }}-

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        working-directory: SleakCraft
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSDL_IBUS=OFF

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        working-directory: SleakCraft
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        working-directory: SleakCraft
        run: cmake --build build --config ${{ matrix.config }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            SleakCraft/build/CMakeFiles/CMakeError.log
            SleakCraft/build/CMakeFiles/CMakeOutput.log

      - name: Confirm the binary was produced
        shell: bash
        working-directory: SleakCraft
        run: |
          found=$(find bin build -name 'SleakCraft*' -type f 2>/dev/null | head -1)
          if [ -z "$found" ]; then
            echo "No SleakCraft binary found after a successful build."
            exit 1
          fi
          echo "Built $found"

      # staging is the testing layer, so every push there leaves a playable
      # build to try before staging is merged into main. bin/ holds the binary
      # next to its assets, the same folder a release packages.
      - name: Upload the staging test build
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging' && matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: SleakCraft-staging-${{ runner.os }}
          retention-days: 14
          if-no-files-found: error
          path: SleakCraft/bin/

  shaders:
    name: Shaders compile and are committed
    needs: engine-ref
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@v7
        with:
          path: SleakCraft
          fetch-depth: 0

      - name: Check out the engine
        uses: actions/checkout@v7
        with:
          repository: CanReader/SleakEngine
          ref: ${{ needs.engine-ref.outputs.ref }}
          path: SleakCraft/Engine

      - name: Install shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc glslang-tools spirv-tools

      # Byte comparison against the committed .spv is not usable here: glslc
      # embeds its own generator version, so a different toolchain produces
      # different bytes from identical source. What matters is that every
      # shader still compiles and that none is missing its committed SPIR-V.
      - name: Every voxel shader compiles
        working-directory: SleakCraft/Game/assets/shaders
        run: |
          fail=0
          for src in *.vert *.frag; do
            [ -e "$src" ] || continue
            case "$src" in *_gl.vert|*_gl.frag) continue ;; esac
            if ! glslc -I ../../../Engine/assets/shaders/include -I include \
                 "$src" -o /tmp/out.spv; then
              echo "FAILED to compile: $src"
              fail=1
            fi
          done
          exit $fail

      - name: Every voxel shader has committed SPIR-V
        working-directory: SleakCraft/Game/assets/shaders
        run: |
          missing=0
          for src in *.vert *.frag; do
            [ -e "$src" ] || continue
            case "$src" in *_gl.vert|*_gl.frag) continue ;; esac
            if [ ! -f "$src.spv" ]; then
              echo "Missing committed SPIR-V for $src"
              missing=1
            fi
          done
          [ $missing -eq 0 ] && echo "All voxel shaders have committed SPIR-V."
          exit $missing

      # Committed .spv are compiled against the engine the game pins, so a
      # change to a game shader, a game include, or an engine include between
      # the base and head pins needs fresh SPIR-V.
      - name: Edited GLSL and engine includes come with SPIR-V
        working-directory: SleakCraft
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ ! -f Engine/scripts/check_spirv_fresh.py ]; then
            echo "::warning::The engine has no scripts/check_spirv_fresh.py."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No base commit to compare against."
            exit 0
          fi
          BASE=$(git merge-base "$BASE" HEAD)
          old_pin=$(git rev-parse "$BASE:Engine")
          new_pin=$(git rev-parse "HEAD:Engine")
          for tree in base head; do
            mkdir -p "/tmp/$tree/Engine/assets/shaders"
            cp -r Engine/assets/shaders/include "/tmp/$tree/Engine/assets/shaders/" 2>/dev/null || true
          done
          git archive "$BASE" Game/assets/shaders | tar -x -C /tmp/base
          git archive HEAD Game/assets/shaders | tar -x -C /tmp/head
          git diff --name-only "$BASE" HEAD -- Game/assets/shaders > /tmp/changed.txt
          if git -C Engine fetch --no-tags --depth=1 origin "$old_pin" "$new_pin"; then
            for pair in "base:$old_pin" "head:$new_pin"; do
              tree=${pair%%:*}
              pin=${pair#*:}
              rm -rf "/tmp/$tree/Engine/assets/shaders/include"
              if git -C Engine cat-file -e "$pin:assets/shaders/include" 2>/dev/null; then
                git -C Engine archive "$pin" assets/shaders/include | tar -x -C "/tmp/$tree/Engine"
              fi
            done
            git -C Engine diff --name-only "$old_pin" "$new_pin" -- assets/shaders/include \
              | sed 's|^|Engine/|' >> /tmp/changed.txt
          else
            echo "::warning::Engine pins are not on the remote, engine include changes are not checked."
          fi
          python3 Engine/scripts/check_spirv_fresh.py --base /tmp/base --head /tmp/head \
            --shaders Game/assets/shaders \
            --include Engine/assets/shaders/include \
            --include Game/assets/shaders/include \
            --changed /tmp/changed.txt

      - name: Every OpenGL shader validates
        working-directory: SleakCraft/Game/assets/shaders
        run: |
          fail=0
          for src in *_gl.vert *_gl.frag; do
            [ -e "$src" ] || continue
            out="/tmp/gl_expanded.${src##*.}"
            if ! glslangValidator -E -I../../../Engine/assets/shaders/include \
                   -Iinclude "$src" > "$out" ||
               ! glslangValidator "$out"; then
              echo "FAILED to validate: $src"
              fail=1
            fi
          done
          exit $fail

      - name: Game frame block matches its C++ mirror
        working-directory: SleakCraft
        run: |
          python3 Engine/scripts/check_ubo_layout.py \
            --header Game/include/World/VoxelLighting.hpp \
            --include-dir Engine/assets/shaders/include \
            --include-dir Game/assets/shaders/include \
            --check CraftFrameData:craft/frame.glsl:CraftFrameUBO

  # Compiling proves nothing about whether the game runs. Runners have no GPU,
  # but Mesa's software Vulkan (lavapipe) plus a virtual display is enough to
  # boot the real binary into a real world and catch startup crashes, missing
  # shaders and failed asset loads.
  smoke:
    name: Headless smoke test
    needs: engine-ref
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the game
        uses: actions/checkout@v7
        with:
          path: SleakCraft

      - name: Check out the engine
        uses: actions/checkout@v7
        with:
          repository: CanReader/SleakEngine
          ref: ${{ needs.engine-ref.outputs.ref }}
          submodules: recursive
          path: SleakCraft/Engine

      - name: Install dependencies and software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache pkg-config xvfb \
            libgl1-mesa-dri mesa-utils \
            mesa-vulkan-drivers vulkan-tools libvulkan1 \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxss-dev libxmu-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            glslc || sudo apt-get install -y glslang-tools

      - uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-craft-smoke-${{ github.sha }}
          restore-keys: ccache-craft-smoke-

      # Debug, because the -world flag that drives this test is Debug only.
      - name: Build Debug
        working-directory: SleakCraft
        run: |
          ccache -M 2G
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DSDL_IBUS=OFF
          cmake --build build

      - name: Report the software renderer in use
        run: |
          xvfb-run -a glxinfo -B 2>/dev/null | grep -iE "renderer|opengl version" || true

      # OpenGL through Mesa's llvmpipe, not Vulkan. A runner has no display
      # server for Vulkan's surface extensions, whereas software GL under a
      # virtual display is well supported. Booting the game is the point here;
      # backend coverage is the build matrix's job.
      - name: Boot into a world
        working-directory: SleakCraft/bin
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          set +e
          timeout --preserve-status 120 \
            xvfb-run -a --server-args="-screen 0 1280x720x24" \
            ./SleakCraft -r opengl -w 640 -h 360 -world citest -seed 42 -rd 4 \
            > smoke.log 2>&1
          status=$?
          set -e
          echo "----- output -----"
          tail -60 smoke.log
          echo "------------------"
          # 124 and 143 mean the timeout stopped a still-running game, which is
          # the success case: it survived to the end of the window.
          if [ $status -ne 0 ] && [ $status -ne 124 ] && [ $status -ne 143 ]; then
            echo "The game exited with status $status before the timeout."
            exit 1
          fi
          if ! grep -q "Creating new world 'citest'" smoke.log; then
            echo "The game never reached world creation."
            exit 1
          fi
          if grep -qiE "\[critical\]|failed to create window" smoke.log; then
            echo "The engine reported a critical failure."
            exit 1
          fi
          if grep -qiE "segmentation fault|assertion .* failed|terminate called" smoke.log; then
            echo "A crash signature appeared in the output."
            exit 1
          fi
          if grep -qE "Shader compilation failed|Shader program linking failed|Cannot read shader" smoke.log; then
            echo "An OpenGL shader failed to build."
            exit 1
          fi
          echo "Booted into a world and survived the run window."

      - name: Upload the smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          retention-days: 7
          if-no-files-found: ignore
          path: SleakCraft/bin/smoke.log
