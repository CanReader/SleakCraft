name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      engine_ref:
        description: Engine branch or SHA to build against
        default: main
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Debug
            os: ubuntu-latest
            config: Debug
          - name: Linux Release
            os: ubuntu-latest
            config: Release
          - name: Windows Debug
            os: windows-latest
            config: Debug
          - name: Windows Release
            os: windows-latest
            config: Release
    steps:
      # Engine/ is a tracked symlink to ../SleakEngine, so the two repos must
      # sit side by side in the workspace for it to resolve.
      - name: Check out the game
        uses: actions/checkout@v4
        with:
          path: SleakCraft

      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          repository: CanReader/SleakEngine
          ref: ${{ github.event.inputs.engine_ref || 'main' }}
          submodules: recursive
          path: SleakEngine

      # Git on Windows materializes the Engine symlink as a plain text file,
      # so CMake sees no directory there. A directory junction gives the same
      # result as the symlink does on Linux and needs no elevation.
      - name: Replace the Engine link with a junction (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: SleakCraft
        run: |
          if exist Engine\NUL (rmdir /s /q Engine) else (if exist Engine del /f /q Engine)
          mklink /J Engine ..\SleakEngine

      - name: Verify the Engine symlink resolves
        shell: bash
        run: |
          cd SleakCraft
          if [ ! -f Engine/CMakeLists.txt ]; then
            echo "Engine/ did not resolve to the engine checkout."
            ls -la Engine || true
            exit 1
          fi
          echo "Engine resolves to $(cd Engine && pwd)"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxss-dev libxmu-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            glslc || sudo apt-get install -y glslang-tools

      - name: Cache compiler output
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-craft-${{ runner.os }}-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ccache-craft-${{ runner.os }}-${{ matrix.name }}-
            ccache-craft-${{ runner.os }}-

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        working-directory: SleakCraft
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSDL_IBUS=OFF

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        working-directory: SleakCraft
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        working-directory: SleakCraft
        run: cmake --build build --config ${{ matrix.config }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            SleakCraft/build/CMakeFiles/CMakeError.log
            SleakCraft/build/CMakeFiles/CMakeOutput.log

      - name: Confirm the binary was produced
        shell: bash
        working-directory: SleakCraft
        run: |
          found=$(find bin build -name 'SleakCraft*' -type f 2>/dev/null | head -1)
          if [ -z "$found" ]; then
            echo "No SleakCraft binary found after a successful build."
            exit 1
          fi
          echo "Built $found"

  shaders:
    name: Shaders compile and are committed
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@v4
        with:
          path: SleakCraft

      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          repository: CanReader/SleakEngine
          path: SleakEngine

      - name: Install glslc
        run: sudo apt-get update && sudo apt-get install -y glslc

      # Byte comparison against the committed .spv is not usable here: glslc
      # embeds its own generator version, so a different toolchain produces
      # different bytes from identical source. What matters is that every
      # shader still compiles and that none is missing its committed SPIR-V.
      - name: Every voxel shader compiles
        working-directory: SleakCraft/Game/assets/shaders
        run: |
          fail=0
          for src in *.vert *.frag; do
            [ -e "$src" ] || continue
            case "$src" in *_gl.vert|*_gl.frag) continue ;; esac
            if ! glslc "$src" -o /tmp/out.spv; then
              echo "FAILED to compile: $src"
              fail=1
            fi
          done
          exit $fail

      - name: Every voxel shader has committed SPIR-V
        working-directory: SleakCraft/Game/assets/shaders
        run: |
          missing=0
          for src in *.vert *.frag; do
            [ -e "$src" ] || continue
            case "$src" in *_gl.vert|*_gl.frag) continue ;; esac
            if [ ! -f "$src.spv" ]; then
              echo "Missing committed SPIR-V for $src"
              missing=1
            fi
          done
          [ $missing -eq 0 ] && echo "All voxel shaders have committed SPIR-V."
          exit $missing

  # Compiling proves nothing about whether the game runs. Runners have no GPU,
  # but Mesa's software Vulkan (lavapipe) plus a virtual display is enough to
  # boot the real binary into a real world and catch startup crashes, missing
  # shaders and failed asset loads.
  smoke:
    name: Headless smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the game
        uses: actions/checkout@v4
        with:
          path: SleakCraft

      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          repository: CanReader/SleakEngine
          submodules: recursive
          path: SleakEngine

      - name: Install dependencies and software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache pkg-config xvfb \
            libgl1-mesa-dri mesa-utils \
            mesa-vulkan-drivers vulkan-tools libvulkan1 \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxss-dev libxmu-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            glslc || sudo apt-get install -y glslang-tools

      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-craft-smoke-${{ github.sha }}
          restore-keys: ccache-craft-smoke-

      # Debug, because the -world flag that drives this test is Debug only.
      - name: Build Debug
        working-directory: SleakCraft
        run: |
          ccache -M 2G
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DSDL_IBUS=OFF
          cmake --build build

      - name: Report the software renderer in use
        run: |
          xvfb-run -a glxinfo -B 2>/dev/null | grep -iE "renderer|opengl version" || true

      # OpenGL through Mesa's llvmpipe, not Vulkan. A runner has no display
      # server for Vulkan's surface extensions, whereas software GL under a
      # virtual display is well supported. Booting the game is the point here;
      # backend coverage is the build matrix's job.
      - name: Boot into a world
        working-directory: SleakCraft/bin
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          set +e
          timeout --preserve-status 120 \
            xvfb-run -a --server-args="-screen 0 1280x720x24" \
            ./SleakCraft -r opengl -w 640 -h 360 -world citest -seed 42 -rd 4 \
            > smoke.log 2>&1
          status=$?
          set -e
          echo "----- output -----"
          tail -60 smoke.log
          echo "------------------"
          # 124 and 143 mean the timeout stopped a still-running game, which is
          # the success case: it survived to the end of the window.
          if [ $status -ne 0 ] && [ $status -ne 124 ] && [ $status -ne 143 ]; then
            echo "The game exited with status $status before the timeout."
            exit 1
          fi
          if ! grep -q "Creating new world 'citest'" smoke.log; then
            echo "The game never reached world creation."
            exit 1
          fi
          if grep -qiE "\[critical\]|failed to create window" smoke.log; then
            echo "The engine reported a critical failure."
            exit 1
          fi
          if grep -qiE "segmentation fault|assertion .* failed|terminate called" smoke.log; then
            echo "A crash signature appeared in the output."
            exit 1
          fi
          echo "Booted into a world and survived the run window."

      - name: Upload the smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          retention-days: 7
          if-no-files-found: ignore
          path: SleakCraft/bin/smoke.log
